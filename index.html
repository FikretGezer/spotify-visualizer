<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Visualizer</title>
<style>
  @property --D{syntax:'<length>';inherits:true;initial-value:240px}
  @property --dx{syntax:'<length>';inherits:true;initial-value:0px}
  body.widget{--dx:0px;transition:--D .35s cubic-bezier(.3,1,.4,1),opacity .28s ease,--dx .3s cubic-bezier(.3,1,.4,1)}
  body.widget.docked:not(.dpeek){--dx:var(--dshift,0px)}
  body.widget #left{translate:calc(var(--dx) * -1) 0}
  body.widget.faded{opacity:0}
  body.widget.noanim{transition:none}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  [hidden]{display:none!important}
  :root{--D:min(34vh,300px)}
  /* ---- Masaüstü widget modu: sadece panel, arka plan şeffaf ---- */
  body.widget{--D:240px;background:transparent}
  html:has(body.widget){background:transparent}
  body.widget canvas,body.widget #modes,body.widget #audio,body.widget #fs{display:none!important}
  body.widget #left{left:70px;bottom:210px;transform-origin:0 100%;transition:opacity .35s,transform .45s cubic-bezier(.2,1.1,.3,1)}
  /* masaüstünden ayıran yumuşak arka plan */
  body.widget::before{content:"";position:fixed;inset:0;pointer-events:none;transition:opacity .4s;
    /* closest-side: her degrade pencere kenarına varmadan tamamen söner → köşeli kesik olmaz */
    background:radial-gradient(circle closest-side at calc(70px - var(--dx,0px) + var(--D,240px)/2) calc(100% - 250px - var(--D,240px)/2), color-mix(in srgb, var(--glow,#1db95440) calc(var(--glowop,1) * 100%), transparent) 0%, transparent 100%),
               radial-gradient(circle closest-side at calc(70px - var(--dx,0px) + var(--D,240px)/2) calc(100% - 250px - var(--D,240px)/2), rgba(5,5,10,.85) 0%, rgba(5,5,10,.7) 55%, transparent 100%),
               radial-gradient(ellipse closest-side at 58% 58%, rgba(5,5,10,.6) 0%, rgba(5,5,10,.35) 60%, transparent 100%);opacity:var(--bgop,.9)}
  body.widget.nolog::before{opacity:0}
  body.nospin #art,body.nospin #mini img{animation:none!important}
  /* küçük mod */
  #mini{display:none}
  body.widget #mini{display:block;position:fixed;left:70px;bottom:210px;width:64px;height:64px;border-radius:50%;cursor:pointer;z-index:3;
    opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,1.4,.4,1)}
  #mini img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#1db954;box-shadow:0 0 0 3px #ffffff30,0 0 24px var(--glow,#1db95488),0 6px 18px #000a;animation:spin 12s linear infinite;animation-play-state:paused}
  #mini img.on{animation-play-state:running}
  #mini::after{content:"";position:absolute;inset:40%;border-radius:50%;background:#111;box-shadow:inset 0 0 0 2px #fff4}
  body.widget.mini:not(.peek) #mini{opacity:1;transform:none;pointer-events:auto}
  body.widget.mini:not(.peek) #left,body.widget.mini:not(.peek) #controls{opacity:0;transform:scale(.25);pointer-events:none}
  body.widget.mini:not(.peek)::before{opacity:0}
  #minBtn{display:none}
  body.widget #minBtn{-webkit-app-region:no-drag;display:grid;place-items:center;position:absolute;left:4px;top:14px;z-index:2;width:28px;height:28px;padding:0;border-radius:50%;
    background:#000a;color:#fff;border:1px solid #fff3;font-size:16px;line-height:1;opacity:0;transition:opacity .2s}
  body.widget #minBtn span{font-size:12px;transition:transform .3s}
  body.widget #left.open #minBtn span{transform:rotate(180deg)}
  /* widget: oynatıcı diskin üstünde açılır */
  body.widget #player{position:absolute;left:0;bottom:100%;margin:0 0 6px;transform:translateY(-16px) scale(.96)}
  body.widget #left.open #player{transform:none}
  body.widget.mini #minBtn::before{content:"📌"} body.widget.mini #minBtn span{display:none}
  body.widget #controls{top:auto;bottom:24px;right:auto;left:24px}
  body.widget #msg{top:auto;bottom:4px;left:24px;max-width:none;text-shadow:0 1px 6px #000}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #stage{position:relative;width:calc(var(--D) + 300px);height:calc(var(--D) + 40px);padding-top:20px}
  #disc{position:relative;width:var(--D);aspect-ratio:1}
  #art{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#222;box-shadow:0 0 60px var(--glow,#1db95466),0 10px 40px #000a;animation:spin 18s linear infinite;animation-play-state:paused}
  #art.on{animation-play-state:running}
  #disc::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#111;box-shadow:inset 0 0 0 3px #fff3}
  @keyframes spin{to{transform:rotate(360deg)}}
  #queue{list-style:none;margin:0;padding:0;position:absolute;left:0;top:20px;width:100%;height:100%;touch-action:none;user-select:none;pointer-events:none}
  #queue li{pointer-events:auto}
  #queue li{position:absolute;left:0;top:0;display:flex;gap:10px;align-items:center;width:250px;padding:5px 8px;border-radius:12px;cursor:pointer;transform-origin:left center;will-change:transform,opacity}
  #queue li.hover{background:#ffffff1c}
  #arcHit{position:absolute;top:-420px;bottom:-260px;left:calc(var(--D) * .62);right:0;touch-action:none}
  #queue img{width:38px;height:38px;border-radius:8px;flex:none;background:#333;object-fit:cover;-webkit-user-drag:none}
  #queue div{min-width:0}
  #queue b,#queue span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  #queue span{opacity:.6;font-size:12px}
  #queue i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.12em;color:#f5a623}
  /* 'şimdi çalıyor' görünümü konuma göre kademeli: --w = 0 (normal) … 1 (en üst) */
  #queue li>div::before{content:"ŞİMDİ ÇALIYOR";display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:#f5a623;overflow:hidden;opacity:var(--lab,0);height:calc(var(--lab,0) * 13px)}
  #controls{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:2}
  button{background:#1db954;color:#000;border:0;border-radius:20px;padding:8px 16px;font-weight:700;cursor:pointer}
  button.sec{background:#fff2;color:#fff}
  #modes{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:2;background:#0006;padding:4px;border-radius:24px;backdrop-filter:blur(8px)}
  #modes button{background:transparent;color:#fffa;padding:6px 14px}
  #modes button.on{background:#fff;color:#000}
  #left{position:fixed;left:40px;bottom:32px;z-index:2;text-shadow:0 1px 8px #000}
  #msg{position:fixed;top:16px;left:16px;opacity:.7;font-size:13px;z-index:2;max-width:50vw}
  /* ---- Oynatıcı: gizli, diske tıklayınca açılır ---- */
  #disc{cursor:pointer}
  #disc:hover #art{filter:brightness(1.08)}
  #player{width:var(--D);box-sizing:border-box;margin-top:14px;padding:16px 18px 14px;border-radius:22px;
    background:linear-gradient(160deg,#ffffff1c,#ffffff08);border:1px solid #ffffff22;backdrop-filter:blur(22px) saturate(1.4);
    box-shadow:0 20px 50px #0009,inset 0 1px 0 #ffffff26;text-shadow:none;
    opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.2,1.3,.4,1)}
  #left.open #player{opacity:1;transform:none;pointer-events:auto}
  #bar{height:6px;width:100%;border-radius:6px;cursor:pointer;position:relative;background:#ffffff1f;touch-action:none}
  #bar::before{content:"";position:absolute;inset:-8px 0}
  #prog{height:100%;width:0;border-radius:6px;position:relative;
    background:linear-gradient(90deg,var(--c2,#7c3cc8),var(--c1,#1db954));box-shadow:0 0 14px var(--glow,#1db95488)}
  #prog::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;
    transform:translateY(-50%) scale(0);transition:transform .2s;box-shadow:0 0 0 4px #ffffff30,0 0 12px var(--glow,#1db954)}
  #bar:hover #prog::after,#bar.drag #prog::after{transform:translateY(-50%) scale(1)}
  #times{display:flex;justify-content:space-between;font-size:11px;margin-top:8px;color:#ffffffa0;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  #ctl{display:flex;gap:18px;margin-top:8px;justify-content:center;align-items:center}
  #ctl button{background:none;color:#fffd;width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;transition:transform .15s,background .2s,color .2s}
  #ctl button:hover{background:#ffffff1a;color:#fff}
  #ctl button:active{transform:scale(.88)}
  #ctl svg{width:20px;height:20px;fill:currentColor}
  #ctl #pp{width:56px;height:56px;color:#111;background:linear-gradient(145deg,#fff,#dcdcdc);
    box-shadow:0 6px 22px var(--glow,#1db95488),inset 0 -2px 0 #0002}
  #ctl #pp:hover{transform:scale(1.07)}
  #ctl #pp svg{width:24px;height:24px}
  /* disk = taşıma tutamacı (Windows'un kendi pencere sürüklemesi) */
  body.widget #disc{cursor:grab}
  body.widget #disc *{pointer-events:none}
  /* küçült butonu (eskiden diske tıklamak yapıyordu) */
  #shrinkBtn{display:none}
  body.widget #shrinkBtn{display:grid;place-items:center;position:absolute;left:38px;top:14px;z-index:3;width:28px;height:28px;padding:0;border-radius:50%;
    background:#000a;color:#fff;border:1px solid #fff3;font-size:16px;line-height:1;opacity:0;transition:opacity .2s;-webkit-app-region:no-drag}
  /* sol üst butonlar: sadece imleç diskin (veya butonların) üstündeyken — durumu main bildirir */
  body.widget.hov #minBtn,body.widget.hov #shrinkBtn{opacity:1}
  /* mini simge de sürüklenebilir; büyütmek için üstüne gelince çıkan buton */
  body.widget #mini{cursor:grab}
  body.widget #mini *{pointer-events:none}
  #expandBtn{display:none}
  body.widget.mini:not(.peek) #expandBtn{display:grid;place-items:center;position:fixed;left:74px;bottom:70px;z-index:4;width:26px;height:26px;padding:0;border-radius:50%;
    background:#000c;color:#fff;border:1px solid #fff4;font-size:14px;line-height:1;opacity:0;transition:opacity .2s;-webkit-app-region:no-drag}
  body.widget.mini.hovmini #expandBtn{opacity:1}
  /* taşırken mavi seçim/odak çerçevesi çıkmasın */
  body.widget{-webkit-user-select:none;user-select:none}
  body.widget img{-webkit-user-drag:none}
  body.widget *:focus{outline:none}
  body.widget ::selection{background:transparent}
  /* Spotify'da çalan yokken widget tamamen görünmez olmasın: küçük plak kalsın */
  body.widget.nolog #mini{opacity:1;transform:none;pointer-events:auto}
  /* widget oynatıcı: daha basık; butonlar daralınca oval olmasın */
  #ctl button{flex:none}
  body.widget #player{padding:10px 14px 8px;border-radius:18px;min-width:200px;margin-bottom:80px}
  body.widget #times{margin-top:5px;font-size:10.5px}
  body.widget #ctl{margin-top:2px;gap:12px}
  body.widget #ctl button{width:34px;height:34px}
  body.widget #ctl #pp{width:42px;height:42px}
  body.widget #ctl #pp svg{width:20px;height:20px}
  /* glow ayarı: 0 = hiç ışık yok */
  /* glow diskin kabında: kenar maskesi parıltıyı kesmesin */
  body.widget #art{box-shadow:none}
  body.widget #disc{border-radius:50%;box-shadow:0 0 60px color-mix(in srgb, var(--glow,#1db95466) calc(var(--glowop,1) * 100%), transparent),0 10px 40px #0008}
  body.widget #mini img{box-shadow:0 0 0 3px #ffffff30,0 0 24px color-mix(in srgb, var(--glow,#1db95488) calc(var(--glowop,1) * 100%), transparent),0 6px 18px #000a}
  /* ses */
  #player{position:relative}
  body.widget #player{position:absolute}
  /* ses butonu: oynat satırının sağında; üstüne gelince sağında dikey bar */
  #vol{position:absolute;right:10px;bottom:16px;display:flex;align-items:flex-end}
  /* oynatıcıyla aynı yükseklik ve aynı cam görünüm */
  #volpop{position:absolute;left:100%;top:-1px;bottom:-1px;margin-left:8px;width:40px;padding:10px 0;box-sizing:border-box;border-radius:18px;
    background:linear-gradient(160deg,#ffffff1c,#ffffff08);border:1px solid #ffffff22;backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 20px 50px #0009,inset 0 1px 0 #ffffff26;display:flex;flex-direction:column;align-items:center;gap:6px;
    opacity:0;transform:translateX(-6px) scale(.95);transform-origin:0 100%;pointer-events:none;transition:opacity .18s,transform .22s cubic-bezier(.2,1.3,.4,1)}
  body.volopen #volpop{opacity:1;transform:none;pointer-events:auto}
  #mute{flex:none;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;color:#fffc;display:grid;place-items:center;cursor:pointer}
  #mute:hover{background:#ffffff1a;color:#fff} #mute svg{width:16px;height:16px;fill:currentColor}
  #volr{-webkit-appearance:none;writing-mode:vertical-lr;direction:rtl;flex:1;width:4px;min-height:0;margin:0;border-radius:4px;outline:none;cursor:pointer;
    background:linear-gradient(0deg,var(--c2,#7c3cc8),var(--c1,#1db954)) 0 100%/100% var(--vp,50%) no-repeat,#ffffff22}
  #volr::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--glow,#1db954)}
  #volv{flex:none;text-align:center;font-size:10px;color:#ffffffa0;font-variant-numeric:tabular-nums}
  /* çalan şarkının kapağında renkli parıltı */
  #nowitem img{box-shadow:0 0 0 2px #ffffff30,0 0 18px 2px color-mix(in srgb, var(--glow,#1db954aa) calc(var(--glowop,1) * 100%), transparent),0 0 6px color-mix(in srgb, var(--glow,#1db954) calc(var(--glowop,1) * 100%), transparent)}
  /* okunabilirlik: açık renkli pencerelerin üstünde de yazılar seçilsin */
  body.widget #player,body.widget #volpop{background:linear-gradient(160deg,rgba(28,28,38,.82),rgba(10,10,16,.78))}
  body.widget #queue li{width:auto;max-width:250px;background:rgba(10,10,16,.62);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 4px 16px #0006;padding-right:12px}
  body.widget #queue li.hover{background:rgba(40,40,52,.78)}
  body.widget #queue b,body.widget #queue span,body.widget #queue li>div::before{text-shadow:0 1px 3px #000,0 0 8px #000a}
  /* disk kenar yumuşaklığı (ayar: --soft px) */
  body.widget #art,body.widget #mini img{-webkit-mask-image:radial-gradient(circle closest-side,#000 calc(100% - var(--soft,0px)),transparent 100%)}
  /* karıştır / tekrarla: açıkken yeşil + altında nokta */
  #ctl button.tog{position:relative;color:#ffffff99}
  #ctl button.tog.on{color:#1ed760}
  #ctl button.tog.on::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#1ed760}
  #ctl button.tog svg{width:17px;height:17px}
  #rep b{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:7px;font-weight:900;line-height:1}
  #rep.track b{display:block}
  body.widget #ctl{gap:6px}
  body.widget #ctl button.tog{width:30px;height:30px}
  body.widget #player{min-width:260px}
  /* oynatıcı diskin altında (disk ekranın tepesindeyken) */
  body.widget.pbelow #player{bottom:auto;top:calc(100% - 6px);margin:0;transform:translateY(16px) scale(.96)}
  body.widget.pbelow #left.open #player{transform:none}
  body.widget.pbelow #minBtn span{display:inline-block;transform:rotate(180deg)}
  /* widget görünürlüğü (ayar) */
  body.widget>#left,body.widget>#mini,body.widget::before{filter:opacity(var(--wop,1))}
  /* arka plan visualizer: arayüz yok, sadece animasyon */
  body.bg>*:not(canvas):not(#lyrics){display:none!important}
  body.bg{cursor:none}

/* sağ taraf: tüm düzen aynalanır, içerikler geri çevrilir (yazı/kapak okunur kalsın) */
body.widget.flipR{scale:-1 1}
body.widget.flipR #queue li>*, body.widget.flipR #player, body.widget.flipR #art, body.widget.flipR #miniimg{scale:-1 1}
/* sol↔sağ geçiş: liste bir tarafta söner, diğer tarafta doğar */
body.widget #queue{transition:opacity .4s ease, filter .4s ease}
body.widget.flipping #queue, body.widget.flipping #player{opacity:0!important;filter:blur(6px);transition:opacity .22s ease, filter .22s ease}
/* sağ dock: ses barı oynatıcının soluna */
body.widget.flipR #volpop{left:auto;right:100%;margin-left:0;margin-right:8px}
/* senkron şarkı sözleri (visualizer): halkanın solunda, büyük harf, kelime kelime */
#lyrics{display:none}
body.bg #lyrics{display:block;position:fixed;top:50%;transform:translateY(-50%);pointer-events:none;text-align:center;
  font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-weight:800;font-size:clamp(30px,3.3vw,64px);line-height:1.05;letter-spacing:-.01em;
  color:#fff;opacity:0;transition:opacity .8s ease;text-shadow:0 0 calc(22px * var(--vglow,1)) color-mix(in srgb,var(--glow,#ffffff40) calc(var(--vglow,1) * 100%),transparent),0 4px 18px #000c}
body.bg.shown #lyrics.on{opacity:1}
body.bg #lyrics.top{transform:translate(-50%,0)}
body.bg #lyrics.mid{transform:translate(-50%,-50%);font-size:clamp(40px,5vw,96px)}
/* şeffaf mod: ortadan kenarlara doğru azalan gölge, duvar kağıdı görünür */
body.bg.vclear::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,var(--shade,.7)) 0%,rgba(0,0,0,calc(var(--shade,.7) * .55)) 30%,rgba(0,0,0,0) 72%);
  clip-path:circle(0% at var(--rx,50%) var(--ry,50%));transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
body.bg.vclear.shown::before{clip-path:circle(150% at var(--rx,50%) var(--ry,50%))}
body.bg.vclear.hiding::before{transition:clip-path .7s cubic-bezier(.6,0,.4,1)}
body.bg #lyrics.out{opacity:0!important;transition:opacity .2s ease}
#lyrics .w{display:inline-block;opacity:0;transform:translateY(.25em) scale(.92);filter:blur(4px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.2,.4,1),filter .35s ease}
#lyrics .w.sm{font-size:.6em;font-weight:700}
#lyrics .w.in{opacity:1;transform:none;filter:none}
/* visualizer açılış/kapanış: diskten büyüyen daire */
html.bgwin,body.bg{background:transparent!important}
body.bg:not(.vclear) canvas{background:#000}
body.bg canvas{clip-path:circle(0% at var(--rx,50%) var(--ry,50%));opacity:0;transition:clip-path 1s cubic-bezier(.7,0,.2,1),opacity .5s ease}
body.bg.shown canvas{clip-path:circle(150% at var(--rx,50%) var(--ry,50%));opacity:1}
body.bg.hiding canvas{transition:clip-path .7s cubic-bezier(.6,0,.4,1),opacity .7s ease .1s}
  /* beğen / listeye ekle */
  #nowitem>div{white-space:nowrap}
  #queue #nowitem>div::before{display:inline-block!important;vertical-align:middle}
  #lib{display:inline-flex;vertical-align:middle;gap:2px;margin-left:6px;opacity:var(--lab,0);height:calc(var(--lab,0) * 20px);overflow:visible;pointer-events:auto}
  #lib *{pointer-events:auto}
  #lib button{width:20px!important;height:20px!important;color:#ffffffc0;position:relative}
  #lib svg{width:13px!important;height:13px!important}
  #lib button.hov{background:#ffffff26;color:#fff}
  body.widget #player{overflow:visible}
  #lib button{background:none;width:26px;height:26px;padding:0;border-radius:50%;display:grid;place-items:center;color:#ffffffa0;transition:transform .15s,color .2s,background .2s}
  #lib button:hover{background:#ffffff1a;color:#fff}
  #lib button:active{transform:scale(.85)}
  #lib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
  #addpl svg{fill:currentColor;stroke:none}
  #like.on{color:#1ed760}
  #like.on svg{fill:currentColor}
  /* mini buton animasyonları */
  .a-pop svg{animation:aPop .42s cubic-bezier(.3,1.6,.5,1)}
  @keyframes aPop{30%{transform:scale(.6)}65%{transform:scale(1.3)}}
  .a-burst::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #1ed760;animation:aBurst .5s ease-out forwards;pointer-events:none}
  @keyframes aBurst{from{transform:scale(.5);opacity:1}to{transform:scale(1.9);opacity:0}}
  .a-shuf svg{animation:aShuf .45s ease}
  @keyframes aShuf{50%{transform:scaleX(-1) scale(1.15)}}
  .a-rep svg{animation:aRep .55s cubic-bezier(.4,1.4,.5,1)}
  @keyframes aRep{to{transform:rotate(360deg)}}
  .a-pp svg{animation:aPP .35s cubic-bezier(.3,1.5,.5,1)}
  @keyframes aPP{from{transform:scale(.3) rotate(-90deg);opacity:0}}
  .a-pp{animation:aPPb .35s ease}
  @keyframes aPPb{40%{box-shadow:0 0 0 8px #ffffff22}}
  .a-prev svg{animation:aPrev .35s ease}
  @keyframes aPrev{40%{transform:translateX(-5px)}}
  .a-next svg{animation:aNext .35s ease}
  @keyframes aNext{40%{transform:translateX(5px)}}
  .a-add svg{animation:aAdd .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes aAdd{to{transform:rotate(180deg)}}
  .a-mute svg{animation:aPop .4s ease}
  #ctl button,#mute,#lib button{position:relative}
  #addpl.ok{color:#1ed760}
  #plpop{position:absolute;left:calc(100% + 56px);top:50%;width:240px;transform:translateY(-50%) translateX(-10px) scale(.97);opacity:0;pointer-events:none;transition:opacity .22s,transform .25s cubic-bezier(.2,.9,.3,1.2);
    background:linear-gradient(160deg,rgba(28,28,38,.92),rgba(10,10,16,.9));backdrop-filter:blur(18px);border:1px solid #ffffff22;border-radius:14px;padding:6px;box-sizing:border-box;z-index:20}
  body.plopen #plpop{opacity:1;transform:translateY(-50%);pointer-events:auto}
  body.widget.flipR #plpop{left:auto;right:calc(100% + 56px);transform:translateY(-50%) translateX(10px) scale(.97)}
  body.widget.flipR.plopen #plpop{transform:translateY(-50%)}
  #plhead{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffffff80;padding:4px 8px 6px}
  #pllist{position:relative;height:220px;overflow:hidden;
    -webkit-mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent)}
  #plin{will-change:transform;padding:10px 0}
  #plsb{position:absolute;right:2px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#ffffff10}
  #plsb b{position:absolute;left:0;right:0;border-radius:3px;background:linear-gradient(#1ed760,#16a34a);box-shadow:0 0 8px #1ed76088}
  #pllist div.it{opacity:0;transform:translateX(-10px);animation:plin .35s forwards}
  @keyframes plin{to{opacity:1;transform:none}}
  #pllist div.it,#pllist .note{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;color:#fffe;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pllist div.it:hover{background:#ffffff1a;padding-left:12px}
  #pllist div.it{transition:padding .2s,background .2s}
  #pllist img,#pllist i{width:28px;height:28px;border-radius:5px;flex:none;object-fit:cover;background:#ffffff14}
  #pllist div.done{color:#1ed760}
  #pllist .note{color:#ffffff90;cursor:default}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="controls">
  <button id="login">Spotify ile bağlan</button>
  <button id="audio" class="sec">🔊 Sesi yakala</button>
  <button id="fs" class="sec">⛶</button>
</div>
<div id="modes"></div>
<div id="left" hidden>
  <div id="stage">
    <div id="disc"><img id="art" crossorigin="anonymous" alt=""></div>
    <button id="minBtn" title="Oynatıcıyı aç/kapat"><span>▲</span></button>
    <ul id="queue">
      <li id="nowitem"><img id="npimg" alt=""><div><nav id="lib"><button id="like" title="Beğenilenlere ekle"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4.5 6 4.5c2.1 0 3.4 1.1 4 2.2.6-1.1 1.9-2.2 4-2.2 3.7 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></svg></button><button id="addpl" title="Çalma listesine ekle"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button></nav><b id="title"></b><span id="artist"></span></div></li>
    </ul>
    <div id="arcHit"></div>
  </div>
  <div id="player">
    <div id="bar" title="Tıkla veya sürükle"><div id="prog"></div></div>
    <div id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div id="plpop"><div id="plhead">Listeye ekle</div><div id="pllist"></div></div>
    <div id="ctl">
      <button id="shuf" class="tog" title="Karıştır"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2-3.2-3z"/></svg></button>
      <button id="prev" title="Geri"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button id="pp" title="Oynat/Durdur"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" title="İleri"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
      <button id="rep" class="tog" title="Tekrarla"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><b>1</b></button>
    </div>
    <div id="vol"><button id="mute" title="Sesi kapat/aç"></button></div>
    <div id="volpop"><span id="volv">50</span><input id="volr" type="range" min="0" max="100" value="50" title="Ses"></div>
  </div>
</div>
<div id="mini"><img id="miniimg" alt=""></div>
<script type="module" src="app.js"></script>
</body>
</html>
